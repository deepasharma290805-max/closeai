<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .test1 { font-family: 'IBM Plex Mono', monospace; font-size: 24px; }
  .test2 { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-variant-numeric: slashed-zero; }
  .test3 { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-feature-settings: "zero" 1; }
</style>
</head>
<body>
  <div class="test1">0 (default)</div>
  <div class="test2">0 (slashed-zero)</div>
  <div class="test3">0 (zero feature)</div>
</body>
</html>
